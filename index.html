<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>LOCOS Y ASOCIADOS API</title>
      <link rel="icon" type="image/jpg" href="https://iili.io/nnBtNig.jpg">
      <meta property="og:description" content="Api gratis - no requiere token">
      <meta property="og:image" content="https://iili.io/K030s44.jpg">
      <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000;
            --secondary: #777;
            --bg-card: #ffffff;
            --border: #ececec;
            --dot-color: #d1d1d1;
            --dot-pattern: radial-gradient(var(--dot-color) 1px, transparent 1px);
            --sk-base: #f0f0f0;
        }
        body {
            font-family: "Share Tech Mono", monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: var(--dot-pattern);
            background-size: 20px 20px;
            color: var(--primary);
        }
        #api-container {
            width: 360px;
            height: 550px;
            padding: 25px;
            background-color: var(--bg-card);
            background-image: var(--dot-pattern);
            background-size: 15px 15px;
            border-radius: 16px;
            border: 2px solid var(--primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.05);
        }
        header { text-align: center; margin-bottom: 5px; }
        #header { font-size: 26px; margin: 0; letter-spacing: 1px; text-transform: uppercase; }
        #fetching { font-size: 10px; color: var(--secondary); text-transform: uppercase; margin-top: 4px; }
        .description {
            font-size: 11px;
            margin: 10px 0 5px 0;
            color: var(--primary);
            line-height: 1.4;
            text-align: center;
       }
        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 5px;
            border-bottom: 1px solid var(--border);
        }
        .left-controls { display: flex; gap: 15px; align-items: center; }
        .icon-btn { cursor: pointer; color: var(--primary); display: flex; align-items: center; text-decoration: none; }
        #search-input-container { display: none; margin: 10px 0; }
        #search-input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid var(--primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 8.5px;
            padding: 6px 10px;
            background: var(--primary);
            color: #fff;
            border-radius: 4px;
            margin-top: 5px;
        }
        .stat-item { display: flex; align-items: center; }
        .table-wrapper {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
        }
        .table-wrapper::-webkit-scrollbar { width: 4px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        .api-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 10px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .api-item:hover { background: var(--primary); color: #fff; }
        .folder-info { display: flex; align-items: center; gap: 12px; }
        .folder-name { font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
        .folder-count { font-size: 9px; opacity: 0.6; }
        .btn-open {
            background: var(--primary);
            color: #fff;
            border: 1px solid var(--primary);
            padding: 5px 10px;
            font-size: 10px;
            border-radius: 4px;
            font-family: inherit;
            cursor: pointer;
        }
        .api-item:hover .btn-open { background: #fff; color: var(--primary); }
        .footer {
            margin-top: 15px;
            padding-top: 15px;
            font-size: 10px;
            border-top: 2px solid var(--primary);
            text-align: center;
            color: var(--secondary);
        }
        .skeleton {
            background-color: var(--sk-base);
            position: relative;
            overflow: hidden;
            border-radius: 3px;
        }
        .skeleton::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
        .sk-stat {
            width: 50px;
            height: 8px;
            background-color: #333;
        }
        .sk-icon {
            width: 20px;
            height: 20px;
        }
        .sk-title {
            width: 100px;
            height: 12px;
            margin-bottom: 6px;
        }
        .sk-sub {
            width: 60px;
            height: 8px;
        }
        .sk-btn {
            width: 45px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div id="api-container">
        <header>
            <h1 id="header">API GP</h1>
            <div id="fetching">API BASICA</div>
        </header>
        <div class="description">
                Aquí están las carpetas con todas las <b>APIS</b> disponible en este sitio web. <br><b>(No Requiere de Token)</b>
        </div>
        <div class="search-area">
            <div class="controls-wrapper">
                <div class="left-controls">
                    <a href="status-api.html" class="icon-btn" title="Information">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                        </svg>
                    </a>
                </div>
                <div id="search-trigger" class="icon-btn">
                    <svg id="icon-search" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <svg id="icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="display: none;">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>
            </div>
            <div id="search-input-container">
                <input type="text" id="search-input" placeholder="BUSCAR POR CATEGORIA O ENDPOINT..." autocomplete="off">
            </div>
        </div>
        <div class="stats-bar">
            <span class="stat-item">ESTADO: ONLINE</span>
            <div style="display: flex; gap: 10px">
                <span id="stat-routers" class="stat-item">
                    <div class="skeleton sk-stat"></div>
                </span>
                <span id="stat-endpoints" class="stat-item">
                    <div class="skeleton sk-stat"></div>
                </span>
            </div>
        </div>
        <div class="table-wrapper">
            <div id="category-list" style="height: 100%; display: flex; flex-direction: column">
                <div class="api-item">
                    <div class="folder-info">
                        <div class="skeleton sk-icon"></div>
                        <div>
                            <div class="skeleton sk-title"></div>
                            <div class="skeleton sk-sub"></div>
                        </div>
                    </div>
                    <div class="skeleton sk-btn"></div>
                </div>
            </div>
        </div>
        <div class="footer">© <span id="year">2026</span> | <b>BY GP</b></div>
    </div>
    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
        const searchTrigger = document.getElementById("search-trigger");
        const searchInputContainer = document.getElementById("search-input-container");
        const iconSearch = document.getElementById("icon-search");
        const iconClose = document.getElementById("icon-close");
        const searchInput = document.getElementById("search-input");
        searchTrigger.addEventListener("click", () => {
            const isHidden = searchInputContainer.style.display === "none" || searchInputContainer.style.display === "";
            if (isHidden) {
                searchInputContainer.style.display = "block";
                iconSearch.style.display = "none";
                iconClose.style.display = "block";
                searchInput.focus();
            } else {
                searchInputContainer.style.display = "none";
                iconSearch.style.display = "block";
                iconClose.style.display = "none";
                searchInput.value = "";
                filterCategories("");
            }
        });
        const MIN_LOADING_MS = 1000; // tiempo minimo que se muestra el skeleton
        async function getApiFiles() {
            const res = await fetch("./api/", { cache: "no-store" });
            if (!res.ok) throw new Error("No se pudo leer /api/");
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, "text/html");
            return [...doc.querySelectorAll("a[href]")]
                .map(a => decodeURIComponent(a.getAttribute("href")))
                .map(href => href.split("/").pop())
                .filter(name => /^[^/]+-[^/]+\.js$/i.test(name));
        }
        function parseApiFiles(files) {
            const groups = {};
            files.forEach(file => {
                const name = file.replace(/\.js$/i, "");
                const separator = name.indexOf("-");
                if (separator < 1 || separator === name.length - 1) return;
                const category = name.slice(0, separator).toUpperCase();
                const endpoint = name.slice(separator + 1);
                if (!groups[category]) groups[category] = [];
                groups[category].push({
                    name: endpoint.toUpperCase(),
                    file,
                    path: `./api/${file}`
                });
            });
            return Object.entries(groups)
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([name, endpoints]) => ({ name, endpoints }));
        }
        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        async function loadCategories() {
            const started = Date.now();
            try {
                const files = await getApiFiles();
                window.apiData = parseApiFiles(files);
                const elapsed = Date.now() - started;
                if (elapsed < MIN_LOADING_MS) {
                    await wait(MIN_LOADING_MS - elapsed);
                }
                renderCategories(window.apiData);
            } catch (err) {
                console.error(err);
                const elapsed = Date.now() - started;
                if (elapsed < MIN_LOADING_MS) {
                    await wait(MIN_LOADING_MS - elapsed);
                }
                document.getElementById("category-list").innerHTML = '<div style="text-align:center; font-size:11px; margin-top:20px;">NO HAY ENDPOINTS DISPONIBLES</div>';
                document.getElementById("stat-routers").textContent = "CATEGORIAS: 0";
                document.getElementById("stat-endpoints").textContent = "ENDPOINTS: 0";
            }
        }
        function renderCategories(categories) {
            const container = document.getElementById("category-list");
            container.innerHTML = "";
            let totalEndpoints = 0;
            categories.forEach(cat => {
                totalEndpoints += cat.endpoints.length;
                const item = document.createElement("a");
                item.className = "api-item";
                item.href = `/api/${encodeURIComponent(cat.name.toLowerCase())}`;
                item.innerHTML = `
                    <div class="folder-info">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <div>
                            <div class="folder-name">${cat.name}</div>
                            <div class="folder-count">${cat.endpoints.length} endpoint(s)</div>
                        </div>
                    </div>
                    <button class="btn-open">VER</button>
                `;
                container.appendChild(item);
            });
            document.getElementById("stat-routers").textContent = `CATEGORIAS: ${categories.length}`;
            document.getElementById("stat-endpoints").textContent = `ENDPOINTS: ${totalEndpoints}`;
        }
        function filterCategories(query) {
            if (!window.apiData) return;
            const q = query.toLowerCase();
            const filtered = window.apiData.filter(cat =>
                cat.name.toLowerCase().includes(q) ||
                cat.endpoints.some(e => e.name.toLowerCase().includes(q))
            );
            renderCategories(filtered);
        }
        searchInput.addEventListener("input", e => filterCategories(e.target.value));
        loadCategories();
    </script>
</body>
  </html>
